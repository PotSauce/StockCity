name: Trade

on:
  schedule:
    # Weekdays 19:35 UTC = 3:35pm New York in summer, 2:35pm in winter (market is open either way).
    - cron: "35 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebalance now even if not due (paper mode can also trade when the market is closed)"
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run the bots
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
          SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
          SCHWAB_TOKEN_JSON: ${{ secrets.SCHWAB_TOKEN_JSON }}
          SCHWAB_ACCOUNT_NUMBER: ${{ secrets.SCHWAB_ACCOUNT_NUMBER }}
        run: python -m engine.run ${{ inputs.force == 'true' && '--force' || '' }}
      - name: Save results
        run: |
          git config user.name "stock-city-bot"
          git config user.email "stock-city-bot@users.noreply.github.com"
          git add -A state docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Trading run $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
